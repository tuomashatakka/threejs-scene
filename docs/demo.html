<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>threejs-scene — post-processing playground</title>
<meta name="description" content="Live, parametrized WebGL post-processing demo: toggle every ported effect and adjust its parameters against a running three.js scene.">
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./demo.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
  }
}
</script>
</head>
<body data-demo>

  <canvas id="scene"></canvas>

  <a class="back" href="./index.html">&larr; threejs-scene</a>

  <aside data-controls aria-label="Post-processing controls">
    <header>
      <strong>Post-processing</strong>
      <button type="button" data-reset>Reset</button>
    </header>
    <p data-hint class="muted">Drag to orbit &middot; scroll to zoom. Toggle an effect, then tune its parameters.</p>
    <div data-fx-list><!-- populated by demo.js --></div>
    <footer>
      <small>WebGL &middot; three r184 &middot; effects ported from threejs-scenes</small>
    </footer>
  </aside>

  <noscript>This demo needs JavaScript and a WebGL2-capable browser.</noscript>

  <script type="module" src="./demo.js"></script>
</body>
</html>
