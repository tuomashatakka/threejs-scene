name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'modules/**'
      - 'site/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package (tsc → dist)
        run: bun run build

      - name: Build site (vite → site/dist, consumes the built package)
        run: bun run build:site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site build (site/dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
