<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>threejs-scene — playground</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #0a0a14; }
    main { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    aside {
      position: fixed;
      left: 1rem;
      bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.6rem 0.9rem;
      color: #cfd2e8;
      font: 13px/1.4 system-ui, sans-serif;
      background: rgb(10 10 20 / 65%);
      backdrop-filter: blur(8px);
      border: 1px solid rgb(160 170 255 / 18%);
    }
    aside output { min-width: 3ch; text-align: right; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main>
    <canvas></canvas>
  </main>
  <aside>
    <label for="speed">speed</label>
    <input id="speed" type="range" min="0" max="4" step="0.1" value="1" />
    <output for="speed">1.0</output>
  </aside>
  <script type="module" src="./main.ts"></script>
</body>
</html>
